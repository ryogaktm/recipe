name: Deploy via FTP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/recipe/
          # data/ と uploads/ はサーバー上の保存データなので触らない
          exclude: |
            **/.git*
            **/.git*/**
            data/**
            uploads/**
            README.md
